
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PetCare | Editar mascota</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

<nav class="navbar navbar-dark barra-superior">

    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/}">

            <i class="bi bi-heart-pulse-fill"></i>
            PetCare

        </a>

        <div class="d-flex gap-4">

            <a class="text-white text-decoration-none"
               th:href="@{/}">
                Inicio
            </a>

            <a class="text-white text-decoration-none"
               th:href="@{/mascotas}">
                Mascotas
            </a>

        </div>

    </div>

</nav>

<main class="container py-5">

    <a class="btn btn-outline-success mb-4"
       th:href="@{/mascotas}">

        <i class="bi bi-arrow-left"></i>
        Volver al listado

    </a>

    <section class="panel formulario-mascota">

        <div class="encabezado-formulario">

            <div class="icono-estadistica verde">
                <i class="bi bi-pencil-square"></i>
            </div>

            <h2 class="fw-bold">Editar mascota</h2>

            <p class="text-secondary">
                Actualiza la información de tu mascota.
            </p>

        </div>

        <form method="post"
              th:action="@{/mascotas/actualizar/{id}(id=${mascota.id})}"
              th:object="${mascota}">

            <div th:if="${#fields.hasAnyErrors()}"
                 class="alert alert-danger">

                <div th:each="error : ${#fields.allErrors()}"
                     th:text="${error}">
                </div>

            </div>

            <h5 class="titulo-seccion">

                <i class="bi bi-heart"></i>
                Información de la mascota

            </h5>

            <div class="row g-4">

                <div class="col-md-6">

                    <label class="form-label">
                        Nombre *
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{nombre}"
                           placeholder="Ej. Luna"
                           maxlength="100"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Especie *
                    </label>

                    <select class="form-select"
                            th:field="*{especie}"
                            required>

                        <option value="">
                            Seleccionar especie
                        </option>

                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Conejo">Conejo</option>
                        <option value="Ave">Ave</option>
                        <option value="Otro">Otro</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Raza *
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{raza}"
                           placeholder="Ej. Labrador"
                           maxlength="100"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Edad (años) *
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{edad}"
                           min="0"
                           max="150"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Sexo *
                    </label>

                    <select class="form-select"
                            th:field="*{sexo}"
                            required>

                        <option value="">
                            Seleccionar sexo
                        </option>

                        <option value="Macho">Macho</option>
                        <option value="Hembra">Hembra</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Color
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{color}"
                           maxlength="100"
                           placeholder="Ej. Dorado">

                </div>

            </div>

            <h5 class="titulo-seccion mt-5">

                <i class="bi bi-person"></i>
                Datos del propietario

            </h5>

            <div class="row g-4">

                <div class="col-md-6">

                    <label class="form-label">
                        Propietario *
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{propietario}"
                           placeholder="Nombre completo"
                           maxlength="100"
                           required>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input type="tel"
                           class="form-control"
                           th:field="*{telefono}"
                           maxlength="30"
                           placeholder="0000-0000">

                </div>

            </div>

            <h5 class="titulo-seccion mt-5">

                <i class="bi bi-shield-check"></i>
                Información de salud

            </h5>

            <div class="row g-4">

                <div class="col-12">

                    <label class="form-label">
                        Estado de vacunación
                    </label>

                    <select class="form-select"
                            th:field="*{vacunacion}">

                        <option value="Pendiente">
                            Pendiente
                        </option>

                        <option value="Vacunado">
                            Vacunado
                        </option>

                    </select>

                </div>

                <div class="col-12">

                    <label class="form-label">
                        Observaciones
                    </label>

                    <textarea class="form-control"
                              th:field="*{observaciones}"
                              rows="4"
                              maxlength="1000"
                              placeholder="Información adicional de la mascota...">
                    </textarea>

                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end flex-wrap gap-3">

                <a class="btn btn-outline-secondary px-4 py-3"
                   th:href="@{/mascotas}">

                    Cancelar

                </a>

                <button type="submit"
                        class="btn btn-petcare">

                    <i class="bi bi-check-circle"></i>
                    Actualizar mascota

                </button>

            </div>

        </form>

    </section>

</main>

<footer class="text-center py-4">

    © 2026 PetCare · Sistema de Gestión de Mascotas

    <br>

    Java 21 · Spring Boot · MySQL

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
