
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare | Detalles de mascota</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<nav class="navbar navbar-dark barra-superior">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-heart-pulse-fill"></i> PetCare
        </a>

        <a class="text-white text-decoration-none"
           th:href="@{/mascotas}">Mascotas</a>
    </div>
</nav>

<main class="container py-5">

    <a class="btn btn-outline-success mb-4"
       th:href="@{/mascotas}">

        <i class="bi bi-arrow-left"></i> Volver al listado

    </a>

    <section class="panel formulario-mascota">

        <div class="perfil-mascota">

            <div class="avatar-grande"
                 th:text="${mascota.especie == 'Perro' ? '🐶' : (mascota.especie == 'Gato' ? '🐱' : '🐾')}">
            </div>

            <div>

                <small>PERFIL DE MASCOTA</small>

                <h1 class="fw-bold mt-2"
                    th:text="${mascota.nombre}">
                </h1>

                <p th:text="${mascota.especie + ' · ' + mascota.raza}">
                </p>

                <span class="badge rounded-pill"
                      th:classappend="${mascota.vacunacion == 'Vacunado' ? 'text-bg-success' : 'text-bg-warning'}"
                      th:text="${mascota.vacunacion}">
                </span>

            </div>

        </div>

        <h5 class="titulo-seccion mt-4">
            Información general
        </h5>

        <div class="row g-3">

            <div class="col-md-6">
                <div class="dato-mascota">
                    <small>ID de registro</small>
                    <strong th:text="${mascota.id}"></strong>
                </div>
            </div>

            <div class="col-md-6">
                <div class="dato-mascota">
                    <small>Edad</small>
                    <strong th:text="${mascota.edad + ' años'}"></strong>
                </div>
            </div>

            <div class="col-md-6">
                <div class="dato-mascota">
                    <small>Sexo</small>
                    <strong th:text="${mascota.sexo}"></strong>
                </div>
            </div>

            <div class="col-md-6">
                <div class="dato-mascota">
                    <small>Color</small>
                    <strong th:text="${#strings.isEmpty(mascota.color) ? 'No registrado' : mascota.color}"></strong>
                </div>
            </div>

            <div class="col-md-6">
                <div class="dato-mascota">
                    <small>Propietario</small>
                    <strong th:text="${mascota.propietario}"></strong>
                </div>
            </div>

            <div class="col-md-6">
                <div class="dato-mascota">
                    <small>Teléfono</small>
                    <strong th:text="${#strings.isEmpty(mascota.telefono) ? 'No registrado' : mascota.telefono}"></strong>
                </div>
            </div>

            <div class="col-md-6">
                <div class="dato-mascota">
                    <small>Fecha de registro</small>
                    <strong th:text="${mascota.fechaRegistro}"></strong>
                </div>
            </div>

            <div class="col-md-6">
                <div class="dato-mascota">
                    <small>Estado de vacunación</small>
                    <strong th:text="${mascota.vacunacion}"></strong>
                </div>
            </div>

            <div class="col-12">
                <div class="dato-mascota">
                    <small>Observaciones</small>

                    <p class="mb-0 mt-2"
                       th:text="${#strings.isEmpty(mascota.observaciones) ? 'Sin observaciones' : mascota.observaciones}">
                    </p>
                </div>
            </div>

        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-end gap-3 flex-wrap">

            <a class="btn btn-outline-secondary"
               th:href="@{/mascotas}">
                Regresar
            </a>

        </div>

    </section>

</main>

<footer class="text-center py-4">
    © 2026 PetCare · Sistema de Gestión de Mascotas
</footer>

</body>
</html>
